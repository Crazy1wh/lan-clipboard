<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>局域网剪贴板</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='18' y='22' width='64' height='62' rx='12' fill='%234f8cff'/><rect x='30' y='38' width='40' height='7' rx='3.5' fill='white'/><rect x='30' y='51' width='40' height='7' rx='3.5' fill='white'/><rect x='30' y='64' width='24' height='7' rx='3.5' fill='white'/></svg>">
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --card2: #1e2230; --border: #2a2f3d;
    --text: #e6e9f0; --muted: #8b93a7; --accent: #4f8cff; --accent2: #6ee7b7;
    --danger: #f87171; --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    max-width: 860px; margin: 0 auto; padding: 20px 16px calc(60px + env(safe-area-inset-bottom));
    touch-action: manipulation;  /* 防双击缩放 */
    -webkit-tap-highlight-color: transparent;
  }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  header h1 { font-size: 20px; font-weight: 700; }
  header .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .hdr-actions { display: flex; gap: 8px; }
  button {
    background: var(--card2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: #2a3042; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { background: #3d7bf0; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  /* 输入区 */
  .composer { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 18px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .tab { padding: 5px 14px; border-radius: 8px; font-size: 13px; color: var(--muted); border: none; background: transparent; }
  .tab.active { background: var(--card2); color: var(--text); font-weight: 600; }
  .panel { display: none; }
  .panel.active { display: block; }
  textarea {
    width: 100%; min-height: 90px; resize: vertical; background: var(--card2);
    border: 1px solid var(--border); border-radius: 8px; color: var(--text);
    padding: 10px; font-size: 16px; font-family: inherit; outline: none;
    -webkit-appearance: none; appearance: none;  /* 16px 防 iOS 聚焦自动放大 */
  }
  textarea:focus { border-color: var(--accent); }
  .composer-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .composer-row .spacer { flex: 1; }
  .hint { color: var(--muted); font-size: 12px; }

  /* 图片/文件上传区 */
  .dropzone {
    border: 2px dashed var(--border); border-radius: 10px; padding: 26px 16px;
    text-align: center; color: var(--muted); font-size: 13px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .dropzone.drag { border-color: var(--accent); background: rgba(79,140,255,.08); }
  body.dragging .composer { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,140,255,.25); }
  body.dragging .dropzone { border-color: var(--accent); background: rgba(79,140,255,.08); }
  .dropzone .big { font-size: 15px; color: var(--text); margin-bottom: 4px; }
  .dropzone input[type=file] { display: none; }
  .preview-box { margin-top: 10px; display: none; }
  .preview-box img { max-height: 160px; max-width: 100%; border-radius: 8px; display: block; }
  .preview-box .fname { font-size: 12px; color: var(--muted); margin-top: 6px; word-break: break-all; }

  /* 历史列表 */
  .list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .list-head .count { color: var(--muted); font-size: 13px; }
  .search-wrap { display: flex; align-items: center; gap: 10px; flex: 1; justify-content: flex-end; }
  .search-wrap input {
    background: var(--card2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 6px 12px; font-size: 16px; width: 190px; outline: none;  /* 16px 防 iOS 聚焦自动放大 */
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--muted); }
  /* 分组栏 */
  .group-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip {
    background: var(--card2); border: 1px solid var(--border); border-radius: 999px;
    color: var(--muted); padding: 4px 12px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .chip:hover { color: var(--text); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .chip.trash:hover { color: var(--danger); border-color: var(--danger); }
  .chip.add { border-style: dashed; }
  .chip .gdel { margin-left: 4px; opacity: .5; }
  .chip .gdel:hover { opacity: 1; color: var(--danger); }
  .item-actions button.star-on { color: #fbbf24; border-color: #fbbf24; }
  .tag.group { color: var(--accent); }
  /* 分组选择菜单 */
  .group-menu {
    position: absolute; z-index: 98; background: var(--card2);
    border: 1px solid var(--border); border-radius: 10px; min-width: 150px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5); overflow-y: auto; max-height: 60vh;
  }
  .group-menu .gm-item { padding: 8px 14px; font-size: 13px; cursor: pointer; }
  .group-menu .gm-item:hover { background: var(--accent); color: #fff; }
  .group-menu .gm-item.muted { color: var(--muted); }
  .item {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 10px; animation: fadein .25s;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; } }
  .item.new { border-color: var(--accent); }
  .item-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; color: var(--muted); }
  .item-meta .tag {
    background: var(--card2); border: 1px solid var(--border); border-radius: 6px;
    padding: 1px 7px; font-size: 11px;
  }
  .item-meta .tag.text { color: var(--accent2); }
  .item-meta .tag.image { color: #fbbf24; }
  .item-meta .tag.file { color: #c4b5fd; }
  .item-meta .ip { font-family: ui-monospace, monospace; }
  .item-meta .dev { font-weight: 600; }
  .item-content { font-size: 14px; line-height: 1.55; word-break: break-word; white-space: pre-wrap; }
  .item-content a { color: var(--accent); text-decoration: none; }
  .item-content a:hover { text-decoration: underline; }
  .item-content img.thumb {
    max-height: 180px; max-width: 100%; border-radius: 8px; cursor: zoom-in; display: block;
  }
  .item-file { display: flex; align-items: center; gap: 10px; }
  .item-file .ficon { font-size: 26px; }
  .item-file .fname { font-size: 14px; word-break: break-all; }
  .item-file .fsize { font-size: 12px; color: var(--muted); }
  .item-actions { display: flex; gap: 6px; margin-top: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .item-actions button { padding: 4px 10px; font-size: 12px; }

  /* 移动端适配 */
  @media (max-width: 640px) {
    body { padding: 12px 10px calc(50px + env(safe-area-inset-bottom)); }
    header { flex-wrap: wrap; gap: 8px; }
    header h1 { font-size: 17px; }
    .search-wrap input { width: 100%; }
    .search-wrap { width: 100%; }
    .list-head { flex-wrap: wrap; gap: 6px; }
    .item-actions { gap: 4px; flex-wrap: nowrap; justify-content: flex-end; }
    .item-actions button { padding: 5px 6px; font-size: 12px; white-space: nowrap; }
    .item-actions .lbl { display: inline; font-size: 11px; }  /* 移动端图标+短文字，紧凑排一行 */
    .item-actions button:first-child { margin-left: 0; }
    .item-content { font-size: 15px; }
    .chip { padding: 5px 12px; }
    .group-bar { gap: 6px; margin-bottom: 8px; }
    .toast { bottom: calc(16px + env(safe-area-inset-bottom)); font-size: 13px; width: max-content; max-width: 86vw; }
    .dropzone { padding: 20px 12px; }
  }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none;
    align-items: center; justify-content: center; z-index: 99; cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 8px; }

  /* 分享弹窗 */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
    align-items: center; justify-content: center; z-index: 99; padding: 20px;
  }
  .modal.open { display: flex; }
  .modal-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    max-width: 340px; width: 100%; padding: 16px;
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 15px; font-weight: 700; margin-bottom: 12px;
  }
  .modal-x { background: transparent; border: none; color: var(--muted); font-size: 15px; padding: 2px 6px; }
  .modal-body { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  #shareQr { background: #fff; padding: 10px; border-radius: 10px; }
  #shareQr svg { display: block; width: 200px; height: 200px; }
  .share-link-row { display: flex; gap: 8px; width: 100%; }
  .share-link-row input {
    flex: 1; min-width: 0; background: var(--card2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 8px 10px; font-size: 12px; outline: none;
  }

  /* 新内容提示 */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--accent); color: #fff; padding: 10px 18px; border-radius: 999px;
    font-size: 13px; font-weight: 600; z-index: 100; opacity: 0;
    transition: all .3s; box-shadow: 0 4px 20px rgba(0,0,0,.4);
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  /* 上传进度条 */
  .upload-bar {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 12px;
  }
  .ub-track {
    height: 6px; border-radius: 3px; background: var(--card2); overflow: hidden;
  }
  .ub-fill {
    height: 100%; width: 0%; border-radius: 3px; background: var(--accent);
    transition: width .15s;
  }
  .ub-info {
    margin-top: 6px; font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
  .spin { display: inline-block; animation: rot 1s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <div>
    <h1>📋 局域网剪贴板</h1>
    <div class="sub" id="connState">连接中…</div>
  </div>
  <div class="hdr-actions">
    <button onclick="refreshAll()" id="btnRefresh">🔄 刷新</button>
    <button class="danger" onclick="clearAll()">🗑 清空</button>
  </div>
</header>

<!-- 输入区 -->
<div class="composer">
  <div class="tabs">
    <button class="tab active" data-panel="text" onclick="switchTab('text')">📝 文字</button>
    <button class="tab" data-panel="image" onclick="switchTab('image')">🖼 图片</button>
    <button class="tab" data-panel="file" onclick="switchTab('file')">📎 文件</button>
  </div>

  <div class="panel active" id="panel-text">
    <textarea id="textInput" placeholder="输入或粘贴文字，URL 自动转为链接…&#10;图片请到「图片」标签选择/拍照上传"></textarea>
    <div class="composer-row">
      <span class="hint">Ctrl+Enter 发送 · 支持长按粘贴</span>
      <span class="spacer"></span>
      <button class="primary" onclick="sendText()">发送 ➤</button>
    </div>
  </div>

  <div class="panel" id="panel-image">
    <div class="dropzone" id="dzImage">
      <div class="big">🖼 点击选择 / 拖拽 / Ctrl+V 粘贴，自动上传</div>
      <div>PNG · JPG · GIF · WEBP · 支持多文件</div>
      <input type="file" id="fileImage" accept="image/*" multiple>
    </div>
  </div>

  <div class="panel" id="panel-file">
    <div class="dropzone" id="dzFile">
      <div class="big">📎 点击选择或拖拽文件，自动上传</div>
      <div>无单文件限制 · 受总量 10GB 约束 · 支持多文件</div>
      <input type="file" id="fileFile" multiple>
    </div>
  </div>
</div>

<!-- 上传进度条 -->
<div class="upload-bar" id="uploadBar" style="display:none">
  <div class="ub-track"><div class="ub-fill" id="ubFill"></div></div>
  <div class="ub-info" id="ubInfo"></div>
</div>

<!-- 分组栏 -->
<div class="group-bar" id="groupBar">
  <button class="chip active" data-view="all" onclick="setView('all')">📋 全部</button>
  <button class="chip" data-view="star" onclick="setView('star')">⭐ 常用</button>
  <span id="groupChips"></span>
  <button class="chip add" onclick="addGroup()">＋ 分组</button>
  <button class="chip trash" data-view="trash" onclick="setView('trash')">🗑 回收站</button>
</div>
<!-- 历史 -->
<div class="list-head">
  <span id="listTitle">🕘 历史记录</span>
  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="🔍 搜索文字 / 文件名" autocomplete="off">
    <span class="hint" id="diskUsage"></span>
  </div>
  <span class="count" id="itemCount"></span>
</div>
<div id="list"></div>
<div class="empty" id="empty" style="display:none">还没有内容，从上方粘贴第一条吧</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()"><img id="lightboxImg" alt=""></div>

<!-- 分享弹窗 -->
<div class="modal" id="shareModal" onclick="closeShare()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-head">📤 分享文件 <button class="modal-x" onclick="closeShare()">✕</button></div>
    <div class="modal-body">
      <div id="shareQr"></div>
      <div class="hint" style="text-align:center">扫码或复制链接，其他人即可下载</div>
      <div class="share-link-row">
        <input id="shareLink" readonly onclick="this.select()">
        <button class="primary" onclick="copyShareLink()">📋 复制</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/vendor/qrcode.js"></script>
<script>
const $ = s => document.querySelector(s);
let lastId = 0;          // 已加载的最大 id
let lastFetch = 0;
const POLL_MS = 10000;

/* ---------- 设备名识别（UA 解析，随上传/发送上报） ---------- */
const DEVICE = (() => {
  const ua = navigator.userAgent;
  try {
    if (/iPhone/.test(ua)) return 'iPhone';
    if (/iPad/.test(ua)) return 'iPad';
    if (/iPod/.test(ua)) return 'iPod';
    const am = ua.match(/Android\s+([\d.]+)[^;]*;\s*([^;)]+)/);
    if (am) return `安卓${am[1]}·${am[2].trim()}`;
    if (/Windows/.test(ua)) return 'Windows';
    if (/Mac OS X/.test(ua)) return 'Mac';
    if (/CrOS/.test(ua)) return 'ChromeOS';
    if (/Linux/.test(ua)) return 'Linux';
  } catch(e) {}
  return '';
})();

/* ---------- 工具 ---------- */
function fmtTime(ts) {
  const d = new Date(ts * 1000);
  const p = n => String(n).padStart(2, '0');
  return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtSize(n) {
  if (n == null) return '';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n/1048576).toFixed(1) + ' MB';
  return (n/1073741824).toFixed(2) + ' GB';
}
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2500);
}
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function linkify(text) {
  const re = /(https?:\/\/[^\s<>"'）)\]]+)/g;
  return esc(text).replace(re, m => `<a href="${m}" target="_blank" rel="noopener">${m}</a>`);
}
/* 局域网 http 下 navigator.clipboard 不可用，用 execCommand 兜底 */
function copyText(text) {
  return new Promise(resolve => {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(()=>resolve(true), ()=>fallbackCopy(text, resolve));
    } else {
      fallbackCopy(text, resolve);
    }
  });
}
function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
  cb(ok);
}

/* ---------- Tab 切换 ---------- */
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.panel === name));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
}

/* ---------- 发送文字 ---------- */
async function sendText() {
  const content = $('#textInput').value.trim();
  if (!content) return toast('内容为空');
  const r = await fetch('/api/text', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({content, device: DEVICE})
  });
  const d = await r.json();
  if (d.ok) {
    $('#textInput').value = '';
    prependItem(d.item);
  } else {
    toast('发送失败: ' + (d.error || r.status));
  }
}

/* ---------- 上传：自动（拖拽/选择/粘贴即传）+ 进度/速度显示 ---------- */
let uploadIndex = 1;
let uploadTotal = 1;

function showUploadBar() {
  $('#uploadBar').style.display = 'block';
  $('#ubFill').style.width = '0%';
}
function fmtETA(secs) {
  if (!isFinite(secs) || secs < 0.5) return '计算中';
  if (secs < 60) return Math.ceil(secs) + 's';
  const m = Math.floor(secs / 60), s = Math.ceil(secs % 60);
  return m + 'm' + s + 's';
}
function updateUploadBar(file, pct, speedMbs, loaded, total) {
  $('#ubFill').style.width = Math.min(100, pct) + '%';
  if (pct >= 100) {
    $('#ubInfo').textContent = `${file.name} 上传完成，正在保存…`;
    return;
  }
  const sizeStr = total ? `${fmtSize(loaded)} / ${fmtSize(total)}` : fmtSize(loaded);
  let eta = '';
  if (total && speedMbs > 0.01) {
    eta = ' · 剩余 ' + fmtETA((total - loaded) / (speedMbs * 1048576));
  }
  $('#ubInfo').textContent =
    `第 ${uploadIndex}/${uploadTotal} 个 · ${file.name} · ${pct}% · ${speedMbs.toFixed(1)}MB/s${eta} · ${sizeStr}`;
}
function hideUploadBar() {
  $('#uploadBar').style.display = 'none';
}

function uploadFile(file) {
  return new Promise(resolve => {
    const kind = file.type && file.type.startsWith('image/') ? 'image' : 'file';
    const startT = Date.now();
    const xhr = new XMLHttpRequest();
    xhr.upload.onprogress = e => {
      if (!e.lengthComputable) return;
      const secs = (Date.now() - startT) / 1000 || 1;
      const speedMbs = e.loaded / secs / 1048576;
      updateUploadBar(file, e.loaded / e.total * 100, speedMbs, e.loaded, e.total);
    };
    xhr.onload = () => {
      let d = {ok: false, error: 'HTTP ' + xhr.status};
      try { d = JSON.parse(xhr.responseText); } catch(e) {}
      if (d.ok) {
        if (view.type === 'all') prependItem(d.item);
        resolve(true);
      } else {
        toast('上传失败: ' + (d.error || xhr.status));
        resolve(false);
      }
    };
    xhr.onerror = () => { toast('上传失败: 网络错误'); resolve(false); };
    xhr.onabort = () => resolve(false);
    const fd = new FormData();
    fd.append('file', file);
    fd.append('kind', kind);
    fd.append('device', DEVICE);
    xhr.open('POST', '/api/upload');
    xhr.send(fd);
  });
}

async function uploadFiles(files) {
  const list = Array.from(files);
  if (!list.length) return;
  uploadIndex = 1;
  uploadTotal = list.length;
  showUploadBar();
  let okCount = 0;
  for (const f of list) {
    if (list.length > 1) {
      updateUploadBar(f, 0, 0, 0, f.size);
    }
    const ok = await uploadFile(f);
    if (ok) okCount++;
    uploadIndex++;
  }
  hideUploadBar();
  toast(`完成：${okCount}/${list.length} 个上传成功`);
  refreshStats();
  if (view.type !== 'all') await loadView();
}

/* 点击 dropzone 选择文件 */
function bindDropzone(dzId, inputId) {
  const dz = $(dzId), input = $(inputId);
  dz.addEventListener('click', () => input.click());
  input.addEventListener('change', () => {
    const files = input.files;
    input.value = '';
    uploadFiles(files);
  });
}

/* ---------- 全局拖拽：任意位置拖入文件自动上传 ---------- */
document.addEventListener('dragover', e => {
  e.preventDefault();
  if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) {
    document.body.classList.add('dragging');
  }
});
document.addEventListener('dragleave', () => document.body.classList.remove('dragging'));
document.addEventListener('drop', e => {
  e.preventDefault();
  document.body.classList.remove('dragging');
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
    uploadFiles(e.dataTransfer.files);
  }
});

/* ---------- 全局 Ctrl+V 粘贴图片，自动上传 ---------- */
document.addEventListener('paste', e => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  const files = [];
  for (const it of items) {
    if (it.type.startsWith('image/')) {
      const f = it.getAsFile();
      if (f) files.push(f);
    }
  }
  if (files.length) {
    e.preventDefault();
    uploadFiles(files);
  }
});

/* ---------- 历史列表渲染 ---------- */
function typeTag(t) {
  return {text: '文字', image: '图片', file: '文件'}[t] || t;
}

function renderItem(it) {
  const div = document.createElement('div');
  div.className = 'item' + (it.id > lastFetch ? ' new' : '');
  div.dataset.id = it.id;
  div.dataset.url = it.url || '';
  div.dataset.fname = it.filename || '';
  div.dataset.size = it.size || 0;

  let body = '';
  if (it.type === 'text') {
    body = `<div class="item-content">${linkify(it.content)}</div>`;
  } else if (it.type === 'image') {
    body = `<div class="item-content"><img class="thumb" src="${it.url}" alt="${esc(it.filename||'图片')}" onclick="openLightbox(this.src)"></div>`;
  } else {
    body = `<div class="item-file">
      <span class="ficon">📄</span>
      <div><div class="fname">${esc(it.filename||'文件')}</div>
      <div class="fsize">${fmtSize(it.size)}</div></div>
    </div>`;
  }

  let actions = '';
  if (view.type === 'trash') {
    actions += `<button onclick="restoreItem(${it.id})">↩ 恢复</button>`;
    actions += `<button class="danger" onclick="purgeItem(${it.id})">彻底删除</button>`;
  } else {
    if (it.type === 'text') {
      actions += `<button onclick="copyItem(${it.id})" title="复制">📋<span class="lbl"> 复制</span></button>`;
    } else {
      actions += `<button onclick="downloadItem(${it.id})" title="下载">⬇<span class="lbl"> 下载</span></button>`;
      actions += `<button onclick="shareItem(${it.id})" title="分享">📤<span class="lbl"> 分享</span></button>`;
    }
    if (it.type === 'image') {
      actions += `<button onclick="openLightbox('${it.url}')" title="查看大图">🔍<span class="lbl"> 查看</span></button>`;
    }
    actions += `<button class="${it.starred ? 'star-on' : ''}" onclick="toggleStar(${it.id})" title="常用">${it.starred ? '★' : '☆'}<span class="lbl"> 常用</span></button>`;
    actions += `<button onclick="showGroupMenu(${it.id}, this, event)" title="分组">🗂<span class="lbl"> 分组</span></button>`;
    actions += `<button class="danger" onclick="hideItem(${it.id})" title="删除">🗑<span class="lbl"> 删除</span></button>`;
  }

  div.innerHTML = `
    <div class="item-meta">
      <span class="tag ${it.type}">${typeTag(it.type)}</span>
      ${it.group_name ? `<span class="tag group">📁 ${esc(it.group_name)}</span>` : ''}
      <span>${fmtTime(it.created_at)}</span>
      <span class="dev">${it.device ? esc(it.device) : ''}</span><span class="ip">${it.device ? '(' + esc(it.ip || '') + ')' : esc(it.ip || '')}</span>
    </div>
    ${body}
    <div class="item-actions">${actions}</div>`;
  return div;
}

function prependItem(it) {
  $('#empty').style.display = 'none';
  const list = $('#list');
  const dup = list.querySelector(`[data-id="${it.id}"]`);
  if (dup) return;
  list.prepend(renderItem(it));
  if (it.id > lastId) lastId = it.id;
  updateCount();
}

function updateCount() {
  $('#itemCount').textContent = $('#list').children.length + ' 条';
}

/* ---------- 操作 ---------- */
async function copyItem(id) {
  const el = document.querySelector(`[data-id="${id}"]`);
  const text = el ? el.querySelector('.item-content').textContent : '';
  if (!text) return;
  const ok = await copyText(text);
  toast(ok ? '已复制 ✓' : '复制失败');
}
function downloadItem(id) {
  const el = document.querySelector(`[data-id="${id}"]`);
  if (!el || !el.dataset.url) return;
  const fname = el.dataset.fname || 'download';
  const GB = 1024 * 1024 * 1024;
  if (parseInt(el.dataset.size || '0', 10) > GB) {
    // 超大文件：走原生下载，避免 XHR 全量进内存导致浏览器崩溃（无进度显示）
    const a = document.createElement('a');
    a.href = location.origin + el.dataset.url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('大文件已开始原生下载（浏览器下载栏查看进度）');
    return;
  }
  showUploadBar();
  const startT = Date.now();
  const xhr = new XMLHttpRequest();
  xhr.open('GET', location.origin + el.dataset.url, true);
  xhr.responseType = 'blob';
  xhr.onprogress = e => {
    if (!e.lengthComputable) return;
    const secs = (Date.now() - startT) / 1000 || 1;
    const speedMbs = e.loaded / secs / 1048576;
    const pct = e.loaded / e.total * 100;
    $('#ubFill').style.width = Math.min(100, pct) + '%';
    let eta = '';
    if (speedMbs > 0.01) {
      eta = ' · 剩余 ' + fmtETA((e.total - e.loaded) / (speedMbs * 1048576));
    }
    $('#ubInfo').textContent =
      `下载中 · ${fname} · ${pct.toFixed(0)}% · ${speedMbs.toFixed(1)}MB/s${eta} · ${fmtSize(e.loaded)} / ${fmtSize(e.total)}`;
  };
  xhr.onload = () => {
    hideUploadBar();
    if (xhr.status === 200 && xhr.response) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(xhr.response);
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
      toast('下载完成 ✓');
    } else {
      toast('下载失败: HTTP ' + xhr.status);
    }
  };
  xhr.onerror = () => { hideUploadBar(); toast('下载失败: 网络错误'); };
  xhr.send();
}
async function hideItem(id) {
  const d = await (await fetch('/api/items/' + id, {method: 'DELETE'})).json();
  if (d.ok) {
    const el = document.querySelector(`[data-id="${id}"]`);
    if (el) el.remove();
    updateCount();
    if (!$('#list').children.length) $('#empty').style.display = 'block';
    toast('已移入回收站，7 天后自动清理，可随时恢复');
  }
}
async function restoreItem(id) {
  await fetch(`/api/items/${id}/restore`, {method: 'POST'});
  toast('已恢复 ✓');
  await loadView();
}
async function purgeItem(id) {
  if (!confirm('彻底删除？磁盘文件将同时移除，不可恢复！')) return;
  await fetch(`/api/items/${id}/purge`, {method: 'DELETE'});
  toast('已彻底删除');
  refreshStats();
  await loadView();
}
async function toggleStar(id) {
  await fetch(`/api/items/${id}/star`, {method: 'POST'});
  await loadView();
}
async function assignGroup(itemId, gid) {
  closeGroupMenu();
  await fetch(`/api/items/${itemId}/group`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({group_id: gid})
  });
  await loadView();
  refreshGroups();
}

/* 分组选择小菜单 */
let groupMenuEl = null;
function showGroupMenu(itemId, btn, ev) {
  if (ev) ev.stopPropagation();
  closeGroupMenu();
  if (!groups.length) {
    toast('还没有分组，点「＋ 分组」创建一个');
    return;
  }
  const menu = document.createElement('div');
  menu.className = 'group-menu';
  menu.innerHTML = groups.map(g =>
    `<div class="gm-item" onclick="assignGroup(${itemId}, ${g.id})">📁 ${esc(g.name)}</div>`
  ).join('') + `<div class="gm-item muted" onclick="assignGroup(${itemId}, null)">🚫 未分组</div>`;
  const rect = btn.getBoundingClientRect();
  menu.style.top = (rect.bottom + 4 + window.scrollY) + 'px';
  menu.style.left = Math.min(rect.left + window.scrollX, window.innerWidth - 170) + 'px';
  document.body.appendChild(menu);
  groupMenuEl = menu;
}
function closeGroupMenu() {
  if (groupMenuEl) { groupMenuEl.remove(); groupMenuEl = null; }
}
document.addEventListener('click', e => {
  if (groupMenuEl && !groupMenuEl.contains(e.target)) closeGroupMenu();
});
async function clearAll() {
  if (!confirm('确定清空全部？将彻底删除所有内容（含回收站），不可恢复！')) return;
  const r = await fetch('/api/items', {method: 'DELETE'});
  const d = await r.json();
  if (d.ok) {
    $('#list').innerHTML = '';
    $('#empty').style.display = 'block';
    lastId = 0;
    updateCount();
    refreshStats();
    toast('已清空');
  }
}

/* ---------- Lightbox ---------- */
function openLightbox(src) { $('#lightboxImg').src = src; $('#lightbox').classList.add('open'); }
function closeLightbox() { $('#lightbox').classList.remove('open'); }

/* ---------- 分享：二维码 + 复制链接 ---------- */
let currentShareLink = '';
function shareItem(id) {
  const el = document.querySelector(`[data-id="${id}"]`);
  if (!el || !el.dataset.url) return;
  const link = location.origin + el.dataset.url;
  currentShareLink = link;
  $('#shareLink').value = link;
  try {
    const qr = qrcode(0, 'M');
    qr.addData(link);
    qr.make();
    $('#shareQr').innerHTML = qr.createSvgTag(4, 4);
  } catch(e) {
    $('#shareQr').innerHTML = '<span class="hint">二维码生成失败</span>';
  }
  $('#shareModal').classList.add('open');
  copyText(link).then(ok => toast(ok ? '链接已自动复制 ✓ 扫码即可下载' : '二维码已生成，请手动复制'));
}
function closeShare() { $('#shareModal').classList.remove('open'); }
async function copyShareLink() {
  const ok = await copyText(currentShareLink);
  toast(ok ? '链接已复制 ✓' : '复制失败，请手动选择复制');
}

/* ---------- 数据加载 ---------- */
async function fetchItems(afterId) {
  const url = afterId ? `/api/items?after_id=${afterId}` : '/api/items';
  const r = await fetch(url);
  return (await r.json()).items;
}
function renderList(items) {
  const titles = {all: '🕘 历史记录', star: '⭐ 常用', trash: '🗑 回收站', group: '📁 分组内容'};
  $('#listTitle').textContent = titles[view.type] || '🕘 历史记录';
  $('#list').innerHTML = '';
  items.forEach(it => {
    if (it.id > lastId) lastId = it.id;
    $('#list').appendChild(renderItem(it));
  });
  const emptyText = view.type === 'trash' ? '回收站是空的' : '还没有内容，从上方粘贴第一条吧';
  $('#empty').textContent = emptyText;
  $('#empty').style.display = items.length ? 'none' : 'block';
  updateCount();
}

/* ---------- 视图与分组 ---------- */
let view = {type: 'all', groupId: null};
let groups = [];

async function setView(type, groupId) {
  view = {type: type, groupId: groupId || null};
  $('#searchInput').value = '';
  searchMode = false;
  document.querySelectorAll('.group-bar .chip[data-view]').forEach(c =>
    c.classList.toggle('active', c.dataset.view === type));
  document.querySelectorAll('#groupChips .chip').forEach(c =>
    c.classList.toggle('active', type === 'group' && c.dataset.gid == groupId));
  await loadView();
}

async function loadView() {
  const params = new URLSearchParams();
  if (view.type === 'trash') params.set('deleted', '1');
  else if (view.type === 'star') params.set('starred', '1');
  else if (view.type === 'group') params.set('group_id', view.groupId);
  try {
    const d = await fetch('/api/items?' + params.toString());
    const items = (await d.json()).items;
    lastId = 0;
    items.forEach(it => { if (it.id > lastId) lastId = it.id; });
    lastFetch = lastId;
    renderList(items);
  } catch(e) {}
}

async function refreshGroups() {
  try {
    const d = await fetch('/api/groups');
    groups = (await d.json()).groups;
    $('#groupChips').innerHTML = groups.map(g =>
      `<button class="chip${view.type === 'group' && view.groupId === g.id ? ' active' : ''}" data-gid="${g.id}" ` +
      `onclick="setView('group', ${g.id})">📁 ${esc(g.name)} (${g.count}) ` +
      `<span class="gdel" onclick="event.stopPropagation();delGroup(${g.id})">✕</span></button>`
    ).join('');
  } catch(e) {}
}

async function addGroup() {
  const name = prompt('新分组名：');
  if (!name || !name.trim()) return;
  const d = await (await fetch('/api/groups', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: name.trim()})
  })).json();
  if (d.ok) {
    toast('分组已创建');
    await refreshGroups();
  }
}

async function delGroup(gid) {
  const g = groups.find(x => x.id === gid);
  if (!confirm(`删除分组「${g ? g.name : ''}」？组内条目将变为未分组，不会被删除。`)) return;
  await fetch('/api/groups/' + gid, {method: 'DELETE'});
  if (view.type === 'group' && view.groupId === gid) view = {type: 'all'};
  await refreshGroups();
  await loadView();
}

async function refreshAll() {
  const btn = $('#btnRefresh');
  btn.innerHTML = '⏳ <span class="spin">⟳</span>';
  try {
    await loadView();
    refreshStats();
    toast('已刷新');
  } catch(e) {
    $('#connState').textContent = '⚠ 连接失败，检查服务是否运行';
  } finally {
    btn.innerHTML = '🔄 刷新';
  }
}

/* ---------- 全局搜索 ---------- */
let searchMode = false;
let searchTimer = null;
async function doSearch() {
  const q = $('#searchInput').value.trim();
  if (!q) {
    searchMode = false;
    await loadView();
    return;
  }
  searchMode = true;
  try {
    const d = await fetch('/api/search?q=' + encodeURIComponent(q));
    const items = (await d.json()).items;
    $('#list').innerHTML = '';
    items.forEach(it => $('#list').appendChild(renderItem(it)));
    $('#empty').textContent = '没有匹配的内容';
    $('#empty').style.display = items.length ? 'none' : 'block';
    $('#itemCount').textContent = `「${q}」${items.length} 条`;
  } catch(e) {}
}

/* ---------- 磁盘占用 ---------- */
async function refreshStats() {
  try {
    const d = await (await fetch('/api/stats')).json();
    $('#diskUsage').textContent = `💾 ${fmtSize(d.disk_used)} / ${fmtSize(d.disk_limit)}`;
  } catch(e) {}
}

async function poll() {
  if (searchMode) return;  // 搜索时暂停自动刷新，避免污染结果
  if (view.type !== 'all') return;  // 非全部视图不做增量插入，避免错乱
  try {
    const items = await fetchItems(lastId);
    if (items.length) {
      items.reverse().forEach(it => prependItem(it));
      lastFetch = lastId;
      toast(`收到 ${items.length} 条新内容`);
    }
    $('#connState').textContent = '● 已连接 · 自动刷新 10s';
    $('#connState').style.color = '#6ee7b7';
  } catch(e) {
    $('#connState').textContent = '⚠ 连接中断，重试中…';
    $('#connState').style.color = '#f87171';
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  bindDropzone('#dzImage', '#fileImage');
  bindDropzone('#dzFile', '#fileFile');
  $('#searchInput').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(doSearch, 300);
  });
  $('#textInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) sendText();
  });
  try {
    await loadView();
    await refreshGroups();
    refreshStats();
    $('#connState').textContent = '● 已连接 · 自动刷新 10s';
    $('#connState').style.color = '#6ee7b7';
  } catch(e) {
    $('#connState').textContent = '⚠ 无法连接服务器';
    $('#connState').style.color = '#f87171';
  }
  setInterval(poll, POLL_MS);
});
</script>
</body>
</html>
