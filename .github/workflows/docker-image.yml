name: Build & Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Define build metadata
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          TRACKING_BRANCH="$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            TRACKING_BRANCH="${DEFAULT_BRANCH:-main}"
          fi
          echo "BUILD_REPOSITORY=$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
          echo "BUILD_BRANCH=$TRACKING_BRANCH" >> "$GITHUB_ENV"
          echo "BUILD_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "BUILD_COMMIT_DATE=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # GHCR: 仓库名可能含大写(Crazy1wh)，Docker tag 必须全小写
      # Docker Hub: 用户名 geeker1998
      - name: Define image names
        env:
          DHU: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          GHCR_IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "GHCR_IMAGE=$GHCR_IMAGE" >> "$GITHUB_ENV"
          echo "DOCKER_IMAGE=$DHU/lan-clipboard" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 同时构建 amd64(x86) + arm64(Apple 芯片/树莓派) 架构
          platforms: linux/amd64,linux/arm64
          # CI 用官方基础镜像；本机构建默认走加速器（见 Dockerfile ARG）
          build-args: |
            PYTHON_IMAGE=python:3.11-slim
            PIP_INDEX_URL=https://pypi.org/simple
            BUILD_REPOSITORY=${{ env.BUILD_REPOSITORY }}
            BUILD_BRANCH=${{ env.BUILD_BRANCH }}
            BUILD_SHA=${{ env.BUILD_SHA }}
            BUILD_COMMIT_DATE=${{ env.BUILD_COMMIT_DATE }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.BUILD_SHA }}
            org.opencontainers.image.created=${{ env.BUILD_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
